services:
  db:
    image: postgres:16-alpine
    container_name: legalflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legalflow
    ports:
      - "5432:5432"
    volumes:
      - legalflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legalflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: legalflow-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/legalflow
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-production-a-very-long-random-string
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_your_key_id}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-your_razorpay_secret}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-rzp_test_your_key_id}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-your_deepseek_api_key}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      LOCAL_UPLOAD_DIR: /app/.uploads
    ports:
      - "3000:3000"
    volumes:
      - legalflow_uploads:/app/.uploads

volumes:
  legalflow_pgdata:
  legalflow_uploads:
